################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,1920x1080,auto,1


###################
### AUTOSTART   ###
###################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Gruvbox-Dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

# Catppuccin Mocha palette
# Mauve:    #cba6f7  Blue:    #89b4fa
# Surface0: #313244  Surface1: #45475a
# Base:     #1e1e2e  Crust:   #11111b

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aff)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1e1e2eee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.35, 1
    bezier = linear, 0, 0, 1, 1
    bezier = bounce, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.7, 0.6, 0.3, 1.25
    bezier = slingshot, 1, -1, 0.15, 1.25

    animation = windows, 1, 6, bounce, slide
    animation = windowsOut, 1, 5, easeOutQuint, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, linear, loop
    animation = fade, 1, 5, easeInOutCubic
    animation = workspaces, 1, 3, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options = caps:ctrl_modifier
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    repeat_rate = 50
    repeat_delay = 200

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}


####################
### KEYBINDINGS  ###
####################

$mainMod = ALT
$terminal = sakura

# General
bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, fuzzel
bind = $mainMod, comma, exec, bash -c 'name=$(echo | fuzzel --dmenu --lines=0 -p "󰏫  Rename: ") && [ -n "$name" ] && hyprctl dispatch renameworkspace $(hyprctl activeworkspace -j | jq -r ".id") "$name"'
bind = $mainMod, G, exec, toggle-gaps
bind = $mainMod SHIFT, F, exec, toggle-float
bind = $mainMod SHIFT, S, exec, freeze-screenshot
bind = $mainMod SHIFT, P, exec, powermenu
bind = $mainMod, W, exec, rofi-wifi-menu
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, B, exec, thunar
bind = $mainMod, C, exec, cliphist list | rofi -dmenu -p "  Clipboard" | cliphist decode | wl-copy
bind = $mainMod CTRL, L, exec, hyprlock

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u
bind = $mainMod, J,     movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left,  resizeactive, -30 0
binde = $mainMod CTRL, up,    resizeactive, 0 -30
binde = $mainMod CTRL, down,  resizeactive, 0 30

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces with mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = $mainMod , S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui
bind = SHIFT, Print,  exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Media / volume (pipewire/wireplumber)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (requires brightnessctl)
bind = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
}

windowrule {
    name = float-nm-applet
    match:class = ^(nm-applet)$
    float = true
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = true
}
