background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    contrast = 1.0
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(cdd6f4ff)
    font_size = 80
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(cba6f7ff)
    font_size = 22
    font_family = IosevkaTerm Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2ef0)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8"> Password</span>
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i> $FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(f9e2afff)
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}
