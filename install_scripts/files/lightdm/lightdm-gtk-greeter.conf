[greeter]
# Background — solid Catppuccin Mocha base color.
# Replace with a path to an image if preferred (e.g. the hyprpaper wallpaper).
background = /usr/share/lightdm/evening-sky.png

# GTK theme installed by install_lightdm_theme.sh
theme-name = Catppuccin-Mocha-LightDM

# Keep Papirus-Dark for consistent icon style; fall back to hicolor
icon-theme-name = Papirus-Dark

# Match the rest of the Hyprland setup
font-name = IosevkaTerm Nerd Font 14
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb

# Panel indicators: session picker, language, clock, power
indicators = ~host;~spacer;~session;~language;~clock;~spacer;~power

# Clock format matching hyprlock style: bold time + date
clock-format = %H:%M  ·  %A, %B %d

# Hide the screensaver (hyprlock handles locking)
screensaver-timeout = 0

# Remove the Kali default avatar
default-user-image = /usr/share/pixmaps/face-default.png
