[main]
font=IosevkaTerm Nerd Font:size=11
icon-theme=Papirus
icons-enabled=yes
terminal=sakura
lines=8
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=10
image-size-ratio=0.5
prompt=

[colors]
background=1e1e2edd
text=cdd6f4ff
match=a6e3a1ff
selection=313244ff
